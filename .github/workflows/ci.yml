name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  abla-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Abla Graphics
        uses: actions/checkout@v6
        with:
          path: abla-graphics

      - name: Check out the Abla compiler
        uses: actions/checkout@v6
        with:
          repository: AndreBaltazar8/ablac
          path: ablac
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap the Abla compiler
        working-directory: ablac
        run: nix-shell --run 'make ablac'

      - name: Run the complete software-driver matrix
        working-directory: abla-graphics
        run: |
          nix-shell --run '
            export VK_DRIVER_FILES="$ABLA_GRAPHICS_LVP_ICD"
            export __EGL_VENDOR_LIBRARY_FILENAMES="$ABLA_GRAPHICS_EGL_VENDOR"
            export LIBGL_DRIVERS_PATH="$ABLA_GRAPHICS_DRI"
            export LIBGL_ALWAYS_SOFTWARE=1
            make check-abla-only test test-samples
          '
