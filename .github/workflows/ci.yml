name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  abla-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Abla Graphics
        uses: actions/checkout@v6
        with:
          path: abla-graphics

      - name: Check out the Abla compiler
        uses: actions/checkout@v6
        with:
          repository: AndreBaltazar8/ablac
          ref: 23156facdb6fdab28c5b230290fa9758be8578fa # v0.2.73
          path: ablac
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # Keep the nix-shell Bash on the compiler revision's nixpkgs pin.
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz

      - name: Bootstrap the Abla compiler
        working-directory: ablac
        run: nix-shell --run 'make ablac'

      - name: Run the complete software-driver matrix
        working-directory: abla-graphics
        run: |
          nix-shell --run '
            export VK_DRIVER_FILES="$ABLA_GRAPHICS_LVP_ICD"
            export __EGL_VENDOR_LIBRARY_FILENAMES="$ABLA_GRAPHICS_EGL_VENDOR"
            export LIBGL_DRIVERS_PATH="$ABLA_GRAPHICS_DRI"
            export LIBGL_ALWAYS_SOFTWARE=1
            make check-abla-only test test-samples
          '
